name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies (if any)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install poetry && poetry install --no-interaction --no-ansi; fi

      - name: Run linters (if available)
        run: |
          if command -v flake8 >/dev/null 2>&1; then flake8 || true; fi
          if command -v pylint >/dev/null 2>&1; then pylint . || true; fi

      - name: Run tests (if present)
        run: |
          if [ -f pytest.ini ] || [ -d tests ]; then
            python -m pytest -q || true
          else
            echo "No tests detected, skipping"
          fi
