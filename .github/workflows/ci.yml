name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore, build and test (.NET)
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore
          dotnet test --no-build --verbosity normal

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & build client
        working-directory: src/Client
        run: |
          npm ci || npm i
          npm run build --if-present

      - name: Upload client build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: src/Client/dist

      - name: Run end-to-end tests (Playwright)
        working-directory: src/Client
        env:
          ASPNETCORE_URLS: http://+:5000
        run: |
          # Install Playwright browsers
          npx playwright install --with-deps

          # Start server in background
          dotnet run --project ../Server -c Release &
          SERVER_PID=$!

          # Serve the built client dist
          npm run serve-dist &
          SERVE_PID=$!

          # Wait for servers to warm up
          sleep 3

          # Run Playwright tests
          npm run e2e

          # Cleanup background processes
          kill $SERVE_PID || true
          kill $SERVER_PID || true
